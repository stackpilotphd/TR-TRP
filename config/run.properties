# ============================================================================
# TR-TRP run configuration
# ============================================================================
#
# This file is intended to live at:
#     <project-root>/config/run.properties
#
# The properties-based Utility reader loads it with:
#     Utility.loadFromProperties();
#
# Lines beginning with # are comments. Values are specified as key=value.
# ============================================================================

# ---------------------------------------------------------------------------
# General run settings
# ---------------------------------------------------------------------------

# Maximum algorithm running time, in seconds.
algorithm.timeLimitSeconds=3600

# Comma-separated tower numbers to process.
# Examples:
#   experiment.towerNumbers=3
#   experiment.towerNumbers=0,1,2,3
experiment.towerNumbers=3

# ---------------------------------------------------------------------------
# Algorithm selection
# ---------------------------------------------------------------------------

# Algorithm code for this run.
# Please, select from the following available algorithms:
#   29   = ICEA: default multi-threaded implementation
#   97   = solve for crews
#   98   = solve for towers with fixed crews
#   96   = no repositioning
#   122  = Unimodal-ICEA
#   69   = branch and price (deterministic)
#   2    = MILP
#   41   = cost of priority: crews and towers
#   44   = cost of priority: crew only
#   43   = cost of priority with fixed crews
#   9810 = upper-bounding heuristic
#   265  = solution analysis: solve MILP with fixed solutions
#   266  = solution analysis: Mean Statistics for Crew and Tower Routes
#   79   = robust ICEA default multi-threaded
#   71   = robust crew only
#   78   = robust solve for towers with fixed crews
#   76   = robust with no repositioning
#   74   = robust cost of priority: crew only
#   73   = robust cost of priority with fixed crews
#   70   = robust MILP
#   7810 = robust upper-bounding heuristic
algorithm.code=29

# ---------------------------------------------------------------------------
# Robust optimization settings
# ---------------------------------------------------------------------------

# Uncertainty budget. Typical values:
#   1, 3, 5
# This setting is used by the robust algorithm variants.
robust.uncertaintyBudget=3

# Alpha parameter. Typical values:
#   0.10, 0.25, 0.35
# This setting is used by the robust algorithm variants.
robust.alpha=0.25